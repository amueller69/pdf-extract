[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extract"
version = "0.1.0"
description = "Hybrid PDF extraction and OCR text-layer rewriting tools."
requires-python = ">=3.10"

[project.scripts]
pdf-extract = "pdfextract.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfextract*"]
